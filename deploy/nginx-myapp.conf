# Reference Nginx site for Dardar SM: plain HTTP on the VPS IP, no domain yet.
# Compare with the live config (sudo nginx -T) rather than overwriting it
# blindly; install steps are in deploy/README.md.
#   /etc/nginx/sites-available/myapp  ->  symlinked from sites-enabled/
#
# What the application relies on:
# - Exactly ONE proxy in front of the app, matching TRUSTED_PROXY_HOP_COUNT=1
#   (lib/http/client-ip.ts takes the LAST X-Forwarded-For entry, which is the
#   address Nginx itself appends via $proxy_add_x_forwarded_for). Putting
#   another proxy or CDN in front would require changing that value.
# - The original Host header, so Next.js Server Actions' origin check sees the
#   same host the browser used.
# - The app listening on 127.0.0.1:3000 only; port 3000 is never public.

# Access logs without query strings: invitation and password-reset links
# carry their tokens in the query string.
log_format myapp_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/myapp.access.log myapp_noquery;
    error_log  /var/log/nginx/myapp.error.log warn;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
