# /etc/systemd/system/myapp.service.d/umask.conf
# Drop-in for the existing myapp.service; nothing else in that unit changes.
#
# Next.js writes its runtime caches into the release (.next/cache and
# .next/server/route-cache). myapp-deploy makes those two folders
# group-owned by nextjs with setgid. With the default umask (0022) the
# subfolders Next creates there are 755, so the deploy user (a member of the
# nextjs group) could not delete them and old releases could never be pruned.
# With 0002 new files and folders are also writable by the nextjs group;
# other users get the same read-only access as before.
[Service]
UMask=0002
