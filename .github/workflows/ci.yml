name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request at a time. A newer push to a pull
# request cancels its superseded run; runs on main are never cancelled
# (each main push queues behind the one in progress instead).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # No Docker/containers anywhere in this project's workflow (see PLAN.md
    # "Local development setup"). GitHub Actions' usual `services:` block
    # for Postgres/Redis runs them as Docker containers under the hood, so
    # this installs both as native Linux processes via apt-get instead —
    # the CI-equivalent of the native-Windows approach used for local dev
    # (Memurai itself isn't applicable on a Linux runner).
    steps:
      # Pinned to release commits (Node 24 action runtime).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install PostgreSQL and Redis natively (no Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb academy_management_saas_ci
          # Separate database for `npm test` and E2E: vitest.config.ts and
          # playwright.config.ts refuse to run unless TEST_DATABASE_URL is
          # set and differs from DATABASE_URL (lib/testing/require-test-database.ts).
          sudo -u postgres createdb academy_management_saas_ci_test

      - run: npm ci

      # Fails on any high/critical advisory in the dependencies that ship
      # with the app. Dev tooling is excluded on purpose; its accepted
      # findings are tracked in docs/dependency-advisories.md.
      - name: Audit production dependencies
        run: npm run audit:prod

      - run: npm run lint

      # next build's own TypeScript check is the "typecheck" step — it also
      # generates .next/types, which a standalone `tsc --noEmit` depends on
      # without ever having run a build first.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci
          REDIS_URL: redis://localhost:6379
          MFA_ENCRYPTION_KEY: ${{ secrets.CI_MFA_ENCRYPTION_KEY }}

      # Production worker bundle (dist/worker.mjs): proves the worker and
      # everything it imports still compile for plain `node`.
      - name: Build worker bundle
        run: npm run build:worker

      # scripts/migrate.mjs is the project's migration runner (also
      # `npm run migrate` / `migrate:prod`): same drizzle migrator and
      # ./drizzle folder as before, plain Node, needs only DATABASE_URL.
      # Running the scripts/migrate.ts wrapper under tsx failed with
      # ERR_REQUIRE_ASYNC_MODULE (the runner uses top-level await).
      - name: Apply migrations
        run: |
          node scripts/migrate.mjs
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci_test node scripts/migrate.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci
          REDIS_URL: redis://localhost:6379
          MFA_ENCRYPTION_KEY: ${{ secrets.CI_MFA_ENCRYPTION_KEY }}

      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci_test
          # Account-email tests (password reset, email change) build their
          # links from APP_URL; the email client itself is mocked.
          APP_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          MFA_ENCRYPTION_KEY: ${{ secrets.CI_MFA_ENCRYPTION_KEY }}

      # Sanity-checks the seed script itself doesn't crash — not one of
      # PLAN.md's explicitly-listed CI checks (lint/typecheck/test/
      # migrations), but cheap and directly exercises this same item's
      # other deliverable.
      - name: Seed smoke test
        run: node --import=tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci
          REDIS_URL: redis://localhost:6379
          MFA_ENCRYPTION_KEY: ${{ secrets.CI_MFA_ENCRYPTION_KEY }}

      # Phase 5, Item 65 — full Playwright coverage. Runs after migrations
      # are applied and only chromium is installed (this repo's own
      # playwright.config.ts only defines a chromium project), matching
      # this job's existing "native processes, no Docker" convention:
      # --with-deps installs the OS-level libraries Chromium needs via
      # apt-get, the same way the Postgres/Redis step above does.
      # playwright.config.ts's own webServer starts `npm run dev` itself
      # and its globalSetup seeds the two-academy E2E fixture
      # (e2e/fixtures/seed-e2e.ts) against this same CI database — no
      # separate seed step needed here.
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy_management_saas_ci_test
          REDIS_URL: redis://localhost:6379
          MFA_ENCRYPTION_KEY: ${{ secrets.CI_MFA_ENCRYPTION_KEY }}
